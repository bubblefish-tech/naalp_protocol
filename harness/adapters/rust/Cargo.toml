[package]
name = "naalp-adapter-rust"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "N-AALP conformance adapter (impl/rust) for the naalp-conform runner"

[[bin]]
name = "naalp-adapter-rust"
path = "src/main.rs"

[dependencies]
naalp = { path = "../../../impl/rust" }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
fips204 = "0.4"
ed25519-dalek = "2"
