# cbindgen config for naalp-ffi (Manufacturing Add-ons Component A).
# Regenerate the header with: cbindgen --config cbindgen.toml --crate naalp-ffi --output include/naalp_ffi.h
language = "C"
header = "// Copyright (c) 2026 BubbleFish Technologies, Inc. Apache-2.0."
include_guard = "NAALP_FFI_H"
autogen_warning = "/* Auto-generated by cbindgen from impl/rust/naalp-ffi/src/lib.rs. Do not edit by hand; edit the Rust source and regenerate. */"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "c"
style = "type"

# No [export] prefix: the Rust type names (NaalpBuffer, NaalpStatus) already carry the
# "Naalp" prefix, so adding one here would double it (NaalpNaalpBuffer) — cbindgen prefixes
# unconditionally, it does not detect an existing prefix.

[enum]
prefix_with_name = false

[parse]
parse_deps = false
