[package]
name = "naalp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reference implementation of N-AALP (draft-bubblefish-naalp-00)"
readme = "QUICKSTART.md"
repository = "https://github.com/bubblefish-tech/naalp_protocol"
homepage = "https://github.com/bubblefish-tech/naalp_protocol"
documentation = "https://docs.rs/naalp"
keywords = ["naalp", "agents", "post-quantum", "cbor", "cose"]
categories = ["cryptography", "encoding"]

[lib]
path = "src/lib.rs"

# docs.rs auto-builds and hosts the rustdoc API reference on publish; build all features there.
[package.metadata.docs.rs]
all-features = true

[dependencies]
sha2 = "0.10"
fips204 = "0.4"
ed25519-dalek = "2"
unicode-normalization = "0.1"
data-encoding = "2"

[dev-dependencies]
serde_json = "1"
hex = "0.4"
